services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - WEBUI_PORT=8080
    volumes:
      - ../files/appdata/qbittorrent:/config
      - ../files/data/downloads:/downloads
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ../files/appdata/prowlarr:/config
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - ../files/appdata/sonarr:/config
      - ../files/data/downloads:/downloads
      - ../files/data/library/tv:/tv
    volumes:
      - ../files/appdata/sonarr:/config
      - ../files/data/downloads:/downloads
      - ../files/data/library/tv:/tv
    restart: unless-stopped
    depends_on:
      - qbittorrent
      - prowlarr

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ../files/appdata/radarr:/config
      - ../files/data/downloads:/downloads
      - ../files/data/library/movies:/movies
    restart: unless-stopped
    depends_on:
      - qbittorrent
      - prowlarr

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ../files/appdata/jellyfin:/config
      - ../files/data/library:/data
    restart: unless-stopped
    depends_on:
      - sonarr
      - radarr

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - TZ=Europe/Paris
    volumes:
      - ../files/appdata/jellyseerr:/app/config
    restart: unless-stopped
    depends_on:
      - jellyfin
      - sonarr
      - radarr

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - TZ=Europe/Paris
      - HOMEPAGE_ALLOWED_HOSTS=legal.stuff.dokploy.ziedscavern.com,home.ziedscavern.com,localhost
    volumes:
      - ../files/appdata/homepage:/app/config
    restart: unless-stopped