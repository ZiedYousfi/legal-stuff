services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - WEBUI_PORT=8080
    volumes:
      - qbittorrent_config:/config
      - downloads:/downloads
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - prowlarr_config:/config
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - sonarr_config:/config
      - downloads:/downloads
      - tv:/tv
    restart: unless-stopped
    depends_on:
      - qbittorrent
      - prowlarr

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - radarr_config:/config
      - downloads:/downloads
      - movies:/movies
    restart: unless-stopped
    depends_on:
      - qbittorrent
      - prowlarr

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - jellyfin_config:/config
      - library:/data
    restart: unless-stopped
    depends_on:
      - sonarr
      - radarr

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - TZ=Europe/Paris
    volumes:
      - jellyseerr_config:/app/config
    restart: unless-stopped
    depends_on:
      - jellyfin
      - sonarr
      - radarr

  homepage-config-gen:
    image: alpine:3.20
    container_name: homepage-config-gen
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./homepage:/source:ro
      - homepage_config:/out
    command: |
      sh -c '
        sed "s|\$${DOMAIN}|$$DOMAIN|g" /source/services.yaml > /out/services.yaml &&
        cp /source/settings.yaml /out/settings.yaml &&
        cp /source/bookmarks.yaml /out/bookmarks.yaml &&
        cp /source/widgets.yaml /out/widgets.yaml
      '
    restart: "no"

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    depends_on:
      - homepage-config-gen
    environment:
      - TZ=Europe/Paris
      - HOMEPAGE_ALLOWED_HOSTS=home.${DOMAIN}
    volumes:
      # Homepage reads config from a volume (managed by Dokploy). No host bind mounts.
      - homepage_config:/app/config
      # Ensure logs are persisted and writable so the app can create /app/config/logs without ENOENT.
      - homepage_logs:/app/config/logs
    restart: unless-stopped

volumes:
  qbittorrent_config:
  prowlarr_config:
  sonarr_config:
  radarr_config:
  jellyfin_config:
  jellyseerr_config:
  homepage_config:
  homepage_logs:
  downloads:
  library:
  tv:
  movies:
