---
buildarr:
  watch_config: true
  update_days:
    - monday
    - tuesday
    - wednesday
    - thursday
    - friday
    - saturday
    - sunday
  update_times:
    - "03:00"

# ══════════════════════════════════════════════════════════════════════════════
# PROWLARR (Utilise "host" pour le download client)
# ══════════════════════════════════════════════════════════════════════════════
prowlarr:
  hostname: prowlarr
  port: 9696
  protocol: http
  api_key: "${PROWLARR_API_KEY}"

  settings:
    general:
      host:
        instance_name: "Prowlarr"
      analytics:
        send_anonymous_usage_data: false

    apps:
      applications:
        delete_unmanaged: false
        definitions:
          Sonarr:
            type: sonarr
            base_url: "http://sonarr:8989"
            api_key: "${SONARR_API_KEY}"
            prowlarr_url: "http://prowlarr:9696"
            sync_level: full-sync
          Radarr:
            type: radarr
            base_url: "http://radarr:7878"
            api_key: "${RADARR_API_KEY}"
            prowlarr_url: "http://prowlarr:9696"
            sync_level: full-sync

# ══════════════════════════════════════════════════════════════════════════════
# SONARR (Utilise "host" pour le download client)
# ══════════════════════════════════════════════════════════════════════════════
sonarr:
  hostname: sonarr
  port: 8989
  protocol: http
  api_key: "${SONARR_API_KEY}"

  settings:
    general:
      host:
        instance_name: "Sonarr"
      analytics:
        send_anonymous_usage_data: false

    media_management:
      rename_episodes: true
      replace_illegal_characters: true
      colon_replacement_format: "dash"
      standard_episode_format: "{Series TitleYear} - S{season:00}E{episode:00} - {Episode CleanTitle} [{Quality Full}]"
      use_hardlinks_instead_of_copy: true

    root_folders:
      definitions:
        - /arr_tv

# ══════════════════════════════════════════════════════════════════════════════
# RADARR (Utilise "hostname" pour le download client)
# ══════════════════════════════════════════════════════════════════════════════
radarr:
  hostname: radarr
  port: 7878
  protocol: http
  api_key: "${RADARR_API_KEY}"

  settings:
    general:
      host:
        instance_name: "Radarr"
      analytics:
        send_anonymous_usage_data: false

    media_management:
      rename_movies: true
      replace_illegal_characters: true
      colon_replacement_format: "dash"
      standard_movie_format: "{Movie CleanTitle} ({Release Year}) [{Quality Full}]"
      use_hardlinks_instead_of_copy: true

    root_folders:
      definitions:
        - /arr_movies
